[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tbt-engine"
version = "0.1.0"
description = "A minimal historical backtesting engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "yfinance",
]

[project.optional-dependencies]
dev = [
    "black",
    "build",
    "isort",
    "pandas-stubs",
    "pyright",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tbt_engine*"]
exclude = ["examples*"]

[tool.setuptools.package-data]
tbt_engine = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pyright]
include = ["tbt_engine", "examples"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
